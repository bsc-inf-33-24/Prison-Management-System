spring.application.name=pms-api

# HTTP server
server.port=${SERVER_PORT:8080}

# Comma-separated browser/WebView origins. Native clients do not use CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

# PostgreSQL connection
# Docker Compose overrides these with SPRING_DATASOURCE_* environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5382/pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Authentication
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=PT30M
auth.login.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.login.lockout-duration=${AUTH_LOCKOUT_DURATION:PT15M}
auth.password-reset-ttl=${AUTH_PASSWORD_RESET_TTL:PT15M}
app.recovery.email.enabled=${RECOVERY_EMAIL_ENABLED:false}
app.recovery.email.from=${RECOVERY_EMAIL_FROM:${SPRING_MAIL_USERNAME:}}

# Schema management
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Shared collection pagination
app.pagination.default-page=0
app.pagination.default-size=20
app.pagination.max-size=100
app.visits.time-zone=${VISITS_TIME_ZONE:Africa/Blantyre}
app.rosters.time-zone=${ROSTERS_TIME_ZONE:Africa/Blantyre}
app.visits.end-reminder.poll-interval=${VISIT_END_REMINDER_POLL_INTERVAL:PT10S}

# Private object storage for inmate portrait photos
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:minio-dev}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:minio-dev-change-this-password}
app.storage.minio.bucket=${MINIO_BUCKET:inmate-photos}
app.storage.minio.max-photo-bytes=${INMATE_PHOTO_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=${INMATE_PHOTO_MAX_BYTES:5MB}
spring.servlet.multipart.max-request-size=${INMATE_MULTIPART_MAX_REQUEST_SIZE:6MB}

# Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Swagger UI Display & Sorting Settings
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
