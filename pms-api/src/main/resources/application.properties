spring.application.name=pms-api

# HTTP server
server.port=${SERVER_PORT:8080}

# PostgreSQL connection
# Docker Compose overrides these with SPRING_DATASOURCE_* environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5382/pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Authentication
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=PT10M
auth.login.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.login.lockout-duration=${AUTH_LOCKOUT_DURATION:PT15M}
app.facility-name=${APP_FACILITY_NAME:Main Facility}

# Schema management
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
