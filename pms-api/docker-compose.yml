services:
  db:
    image: postgres:17-alpine
    container_name: pms-db
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5382:5432"
    volumes:
      - pms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_user -d pms"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: pms-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pms
      SPRING_DATASOURCE_USERNAME: pms_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  pms-data: